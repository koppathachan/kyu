# CI runs the same make targets a developer runs locally, so that a red build
# can be reproduced by typing what it typed.
#
#   go         formatting, module tidiness, vet, and the tests with -race
#   contracts  proto lint and format, breaking-change detection, and the check
#              that the committed kyu/ is what regeneration produces
#   images     both container images build
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make tidy-check
      - run: make vet
      - run: make test
      - run: make build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking reads the commit it compares against from local
          # history, so the whole of it is needed.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # buf is installed, not run by the action: the checks below are make
      # targets, so CI and a developer's machine run the same commands.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.50.0
          setup_only: true
      - run: make lint-proto
      - run: make generate-check
      # Compared against the commit this change is built on: the base of a
      # pull request, or the tip of main before a push. A push that creates
      # the branch has no previous tip, and is not compared.
      - name: make breaking
        env:
          AGAINST: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$AGAINST" ] || [ "$AGAINST" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous commit to compare against"
            exit 0
          fi
          make breaking BREAKING_AGAINST=".git#ref=$AGAINST"

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make docker-image
