[package]
name = "kyu-memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-memory Kyu v1 storage provider."

[features]
# Off by default so `cargo test` runs only your own tests. Turn it on to run the
# conformance suite: `cargo test -p kyu-memory --features conformance`.
conformance = []

[dependencies]
# `MemoryProvider` implements `kyu_conformance::StorageProvider`, so the
# contract crate is part of this crate's public API, not just its tests.
kyu-conformance = { path = "../kyu-conformance" }
