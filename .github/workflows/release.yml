# A release is a pushed tag: git tag v0.1.0 && git push origin v0.1.0
#
#   checks    the whole of CI, so nothing is released that CI would reject
#   packages  GoReleaser: archives, checksums, .deb/.rpm/.apk, the Homebrew
#             cask, and the GitHub Release that carries them
#   images    ghcr.io/koppathachan/kyu and kyu-memstore, linux/amd64 + arm64
#   module    asks the Go module proxy for the tag, so `go get …@v0.1.0` and
#             pkg.go.dev see it at once instead of on first request
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  packages:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload to it
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog is built from history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without it the cask is built but not pushed to the tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      matrix:
        image: [kyu, kyu-memstore]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/koppathachan/${{ matrix.image }}
          # v1.2.3 is tagged 1.2.3 and 1.2; latest moves only on a final
          # release, never on a prerelease such as v1.3.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  module:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: GOPROXY=https://proxy.golang.org go list -m "github.com/koppathachan/kyu@${GITHUB_REF_NAME}"
