[package]
name = "kyu-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generated Rust types for kyu.storage.v1, compiled from spec/kyu/storage/v1/storage.proto."

[dependencies]
prost = "0.14"
prost-types = "0.14"
# `default-features = false` keeps the generated service definitions without
# pulling in the hyper/tokio transport stack; the gRPC binding is not built here.
tonic = { version = "0.14", default-features = false, features = ["codegen", "server"] }
tonic-prost = "0.14"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"
