# spec/ is the contract root and the sole proto path: the directory under it
# mirrors the proto package exactly, so a package name and a file path cannot
# disagree.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The service names are fixed by the specifications: kyu.v1.Kyu and
    # kyu.storage.v1.Storage. "KyuService" would read as a second thing.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
